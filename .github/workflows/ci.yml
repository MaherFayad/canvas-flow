name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Bundle size budget (bridge, mock, SDK core, extension zip)
        run: pnpm size

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the extension
        run: pnpm --filter @flowcanvas/extension build
      - name: Install Chromium for Playwright (version pinned in e2e/package.json)
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: E2E (new headless Chromium with the unpacked extension)
        id: headless
        continue-on-error: true
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm e2e
      - name: E2E fallback (headed under xvfb, failed tests only)
        if: steps.headless.outcome == 'failure'
        working-directory: e2e
        env:
          E2E_SKIP_BUILD: '1'
          HEADED: '1'
        run: xvfb-run -a npx playwright test --last-failed
      - name: Upload report, screenshots, a11y and perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/a11y-report.md
            e2e/perf-report.md
          retention-days: 14
          if-no-files-found: warn
